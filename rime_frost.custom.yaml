# LaTeX
# encoding: utf-8


patch:
  # Frost 新版的候选置顶过滤器受 pin_cand 开关控制；默认保持启用。
  switches/@8/reset: 1

  # 候选窗口打开时按分号，记录当前页候选和上一次上屏内容，然后清除输入。
  # 放在 processor 队列最前，覆盖原有的“分号选择第 2 候选”行为。
  "engine/processors/@before 0": lua_processor@*candidate_logger

  # 连续输入时按反斜杠，定位到当前未确认部分的第一个音节进行单字选择。
  # 空输入时不触发，保留反斜杠作为 LaTeX 输入前缀。
  key_binder/bindings/+:
    - { when: composing, accept: backslash, send_sequence: "{Home}{Shift+Right}" }
# type '\' will pull in English punctuation, so need to switch to Chinese punctuation
  # switches/+:
    # - name: ascii_punct # 
      # states: [ ¥, $ ]
      # reset: 0
# make '\' go into the candidate box
  speller/alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`/\\
  speller/initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA\\
  speller/algebra/+:
    - xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
    - xform/^ng$/eng/
    - xform/ńg|ňg|ǹg/eng/
    - xform/ń|ň|ǹ/en/
  translator/dictionary: rime_frost_lmdg
  radical_reverse_lookup/dictionary: rime_frost_lmdg
# or customize punctuator to make '\' go into the candidate box like below(please uncomment yourself)
#  punctuator/half_shape:
#    "\\": ["\\"]
#  punctuator/full_shape:
#    "\\": ["、", "＼"]

  engine/+:
    translators/+:
      - table_translator@latex_input
  engine/processors/+:
    - lua_processor@*latex_auto_commit

# meaning of the regex: ^ (start of line), \\(the starting \), .+(any char 1 or more time), $(end)
# first '\\' is recognized as a symbol(half_shape or full_shape). double '\\' make it to be recognized as a pattern
# translator's prefix will consume one '\\'. so user only type once '\' key, only recognize uppercase and lowercase letters, so you can use the number keys to select words.
  "recognizer/patterns/latex_input": "^\\\\[a-zA-Z]+$"
  radical_lookup/prefix: "v"
  recognizer/patterns/radical_lookup: "^v[a-z]+$"
  schema/dependencies/+:
    - latex
  latex_input:
    tag: abc
    dictionary: latex
    prefix: ""
    enable_sentence: false
    enable_completion: true # enable autocomplete
    enable_user_dict: true # enable word frequency,  use with user_dict
    user_dict: custom_latex_user # generate a file name custom_latex_user.txt
    db_class: tabledb
    tips: "[LaTeX]"

  latex_auto_commit:
    enable_log: false
    fast_commit_single_candidate: false

  # Pin candidates. Format: "code<Tab>word1 word2"
  pin_cand_filter/+:
    # 注意此处第一个空格为 \t
    - a	啊 阿
    - b	吧 把
    - c	才 从
    - d	的 地 得
    - e	呃
    - g	个 各
    - h	和 或
    # - i 在 custom_phrase 置顶了 一 以 已 亦
    - j	就 将 即 及 既 继
    - k	可
    - l	了 啦 喽 嘞
    - m	吗 嘛
    - n	那 哪 你
    - o	哦
    # - u 在 custom_phrase 置顶了 有 🈶 又 由
    - s	是 使 式 时
    - t	他 她 它 祂
    - w	我
    - x	想 像 向
    # - y	与 于
    - z	在 再 自
    # 常用单字
    - en	嗯 恩
    - ta	他 她 它 祂
    - de	的 地 得
    - ba	把 吧
    - ni	你
    - ma	吗 嘛
    - zh	这
    - dd	等等
    - dddd	等等等等
    - gg	刚刚
    - zd	知道
    - bzd	不知道
    - ww	喔喔
    - hh	哈哈
    - yw	因为
    - sm	什么
    - wsm	为什么
    - sbs	是不是
    - msm	没什么
    - smd	什么的
    - sms	什么是
    - sma	什么啊
    - ky	可以
    - kn	可能
    - qing jie shi	请解释
    - qjs	请解释
